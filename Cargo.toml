[package]
name = "lancer-promptfoo"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation + GUI of promptfoo — the LLM red-team & eval framework. Part of the Lancer bug bounty toolkit."
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-promptfoo"

# Library crate: all logic lives here so every binary can share it.
[lib]
name = "lancer_promptfoo"
path = "src/lib.rs"

# Primary binary — opens the native GUI by default, falls through to the CLI
# surface when a subcommand or `--cli` is given.
[[bin]]
name = "lancer-promptfoo"
path = "src/main.rs"

# Companion CLI-only binary (headless / CI / scripting). Never links the GUI.
[[bin]]
name = "lancer-promptfoo-cli"
path = "src/bin/cli.rs"

[features]
default = ["gui"]
# The native egui desktop frontend. On by default (plain invocation opens the
# GUI per the Lancer-standard pattern). Build with --no-default-features for a
# headless CLI-only binary (CI / servers without a display).
gui = ["dep:eframe", "dep:egui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
axum = { version = "0.7", features = ["json"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
directories = "5"
futures = "0.3"
async-trait = "0.1"
regex = "1"

# GUI stack (optional, enabled by the `gui` feature).
eframe = { version = "0.28", optional = true, default-features = true }
egui = { version = "0.28", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
